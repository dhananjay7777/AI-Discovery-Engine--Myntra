name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify JSON store
        run: npm run phase0:verify-store

      - name: Phase map status is in sync
        run: npm run phases:check

      - name: Build
        run: npm run build

      - name: Throttle and backoff tests
        run: npm run test:throttle
