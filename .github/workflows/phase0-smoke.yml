name: Phase 0 Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "data/**"
      - "package.json"

jobs:
  phase0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify JSON store
        run: npm run phase0:verify-store

      - name: Phase 0 smoke (Groq + embeddings + run insert)
        run: npm run phase0:smoke
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_GATE_MODEL: openai/gpt-oss-20b
          GROQ_EXTRACTION_MODEL: openai/gpt-oss-120b
          GROQ_AGREEMENT_MODEL: qwen/qwen3.8-27b
